<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width,
      initial-scale=1.0">
    <title>MOCKUP v2 · Inside AI Buddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="index_files/css2_Fk7X.css" rel="stylesheet">
    <style>
    :root {
      --bg:        #f5f7f5;
      --surface:   #ffffff;
      --border:    #d8e0da;
      --accent:    #2e7d52;
      --accent-dim:#5aab7a;
      --text:      #000000;      /* Pure black */
      --text-dim:  #333333;      /* Dark gray */
      --text-bright:#000000;     /* Pure black */
      --mono: 'JetBrains Mono', monospace;
      --serif: 'Libre Baskerville', Georgia, serif
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }

    /* ── HEADER ── */
    header {
      border-left: 2px solid var(--accent);
      padding-left: 1.5rem;
      margin-bottom: 3.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .name {
      font-family: var(--serif);
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      color: var(--text-bright);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .tagline {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    .location {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 0.3rem;
      letter-spacing: 0.08em;
    }

    /* ── SECTIONS ── */
    section {
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    section:nth-child(2) { animation-delay: 0.1s; }
    section:nth-child(3) { animation-delay: 0.2s; }
    section:nth-child(4) { animation-delay: 0.3s; }
    section:nth-child(5) { animation-delay: 0.4s; }

    .section-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--accent-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── BIO ── */
    .bio {
      font-size: 0.97rem;
      color: var(--text);
      line-height: 1.85;
    }

    .bio em {
      color: var(--text-bright);
      font-style: italic;
    }

    /* ── CONTACT ── */
    .contact-link {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-dim);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .contact-link:hover {
      color: var(--text-bright);
      border-color: var(--text-bright);
    }

    /* ── INTEREST DOMAIN TAGS ── */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.3rem 0.65rem;
      letter-spacing: 0.04em;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      cursor: default;
    }

    .tag:hover {
      color: var(--accent);
      border-color: var(--accent-dim);
      background: rgba(76, 175, 120, 0.05);
    }

    /* ── STACK LIST ── */
    .stack-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.35rem 1.5rem;
    }

    .stack-list li {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-dim);
      padding: 0.2rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stack-list li::before {
      content: '›';
      color: var(--accent-dim);
      font-size: 0.9rem;
    }

    /* ── PROJECTS ── */
    .projects {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .project {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.9rem 1.1rem;
      background: var(--surface);
      transition: border-color 0.2s, background 0.2s;
    }

    .project:hover {
      border-color: var(--accent-dim);
      background: rgba(76, 175, 120, 0.03);
    }

    .project-name {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 0.3rem;
      letter-spacing: 0.04em;
    }

    .project-desc {
      font-size: 0.88rem;
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* ── FOOTER ── */
    footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.5s forwards;
    }

    /* ── FIGURES / MEDIA ── */
    figure { margin: 0; }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
    }
    figcaption {
      font-family: var(--mono);
      font-size: 0.68rem;
      line-height: 1.6;
      letter-spacing: 0.04em;
      color: var(--text-dim);
      margin-top: 0.6rem;
      padding-left: 0.75rem;
      border-left: 2px solid var(--accent-dim);
    }

    /* photo floated to the right of a card's text */
    .card-shot {
      float: right;
      width: 30%;
      max-width: 170px;
      margin: 0.2rem 0 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    a.project { display: flow-root; }
    .go {
      margin-top: 0.8rem;
      font-family: var(--mono);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      border-top: 1px solid var(--border);
      padding-top: 0.7rem;
    }
    .go span { display: inline-block; transition: transform 0.18s ease; }
    a.project:hover .go { text-decoration: underline; }
    a.project:hover .go span { transform: translateX(4px); }
    a.go { display: block; text-decoration: none; }
    a.go:hover { text-decoration: underline; }
    a.go:hover span { transform: translateX(4px); }

    /* ── ORG-CHART BRANCHES under a parent card ── */
    .branch {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-left: 1.5rem;
      padding-left: 1.5rem;
    }
    .branch > .project { position: relative; }
    .branch > .project::before {
      content: '';
      position: absolute;
      left: calc(-1.5rem - 1px);
      top: -1rem;
      width: 1.5rem;
      height: 2.3rem;
      border-left: 2px solid var(--accent-dim);
      border-bottom: 2px solid var(--accent-dim);
      border-bottom-left-radius: 6px;
    }
    .branch > .project:not(:last-child)::after {
      content: '';
      position: absolute;
      left: calc(-1.5rem - 1px);
      top: 1.3rem;
      bottom: -0.75rem;
      border-left: 2px solid var(--accent-dim);
    }

    .trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin: 1rem 0 0;
    }
    .trio figure { margin: 0; }
    .trio img {
      width: 100%;
      height: 280px;
      object-fit: contain;          /* portrait screenshot gets whitespace either side */
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: block;
    }
    .trio figcaption {
      margin-top: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      line-height: 1.45;
    }
    @media (max-width: 620px) {
      .trio { grid-template-columns: 1fr; }
      .trio img { height: auto; max-height: 340px; }
    }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 1rem 0 0;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── MOBILE ── */
    @media (max-width: 480px) {
      .container { padding: 2.5rem 1.25rem 4rem; }
      .stack-list { grid-template-columns: 1fr 1fr; }
      .pair { grid-template-columns: 1fr; }
      .branch { margin-left: 0.75rem; padding-left: 1rem; }
      .branch > .project::before,
      .branch > .project:not(:last-child)::after { left: calc(-1rem - 1px); }
      .branch > .project::before { width: 1rem; }
    }
  </style>
  <style>
    /* ── MOCKUP v2 (page 2) ── */
    .back { font-family:var(--mono); font-size:0.72rem; color:var(--accent); text-decoration:none; letter-spacing:0.08em; }
    h1.pt { font-family:var(--serif); font-size:clamp(1.8rem,5vw,2.4rem); margin:1.2rem 0 0.4rem; color:var(--text-bright); }
    .lede { font-size:0.95rem; color:var(--text-dim); margin-bottom:2rem; }
    .layout { display:grid; grid-template-columns:260px 1fr; gap:1.6rem; align-items:start; }
    @media (max-width:700px) { .layout { grid-template-columns:1fr; } .phone { margin:0 auto; } }
    /* phone stand-in */
    .phone { width:250px; border:10px solid #1d1f22; border-radius:28px; background:#f4f5f7; padding:0.6rem 0.5rem 1rem;
      position:sticky; top:1rem; box-shadow:0 6px 20px rgba(0,0,0,0.15); }
    .phone { padding:0; background:#14141a; overflow:hidden; }
    .screen { position:relative; line-height:0; }
    .screen img { width:100%; display:block; }
    .hit { position:absolute; left:0; right:0; cursor:pointer; border-radius:6px; }
    .hit:hover, .hit.hl { background:rgba(90,171,122,0.22); outline:2px solid var(--accent-dim); }
    .hit .num { position:absolute; left:2px; top:50%; transform:translateY(-50%); margin:0; box-shadow:0 0 0 2px #14141a; }
    #soonrows { width:250px; margin:0 auto; }
    .phone .bar { font-family:var(--mono); font-size:0.6rem; color:#555; text-align:center; margin-bottom:0.5rem; }
    .phone .standin { font-family:var(--mono); font-size:0.55rem; color:#b3541e; text-align:center; margin-bottom:0.4rem; }
    .lane { display:flex; align-items:center; gap:0.5rem; background:#fff; border-radius:8px; padding:0.4rem 0.45rem;
      margin-bottom:0.35rem; cursor:pointer; border:1px solid #e3e6ea; position:relative; }
    .lane:hover, .lane.hl { outline:2px solid var(--accent); }
    .lane .ic { width:22px; height:22px; border-radius:6px; flex:none; }
    .lane .nm { font-family:system-ui,sans-serif; font-size:0.74rem; font-weight:600; color:#222; }
    .lane.soon { background:transparent; border-style:dashed; cursor:pointer; }
    .lane.soon .nm { color:#888; font-weight:500; }
    .num { font-family:var(--mono); font-size:0.62rem; font-weight:600; color:#fff; background:var(--accent);
      border-radius:50%; width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; flex:none; margin-left:auto; }
    .soon .num, .tile.soon .num { background:#999; }
    /* tiles */
    .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:0.8rem; }
    .tile { border:1px solid var(--border); border-radius:4px; background:var(--surface); padding:0.75rem 0.85rem;
      cursor:pointer; display:flex; flex-direction:column; gap:0.35rem; transition:border-color .2s; }
    .tile:hover, .tile.hl { border-color:var(--accent); }
    .tile .top { display:flex; align-items:center; gap:0.5rem; }
    .tile .top .num { margin-left:0; }
    .tile .project-desc { font-size:0.82rem; }
    .tile .more { font-family:var(--mono); font-size:0.66rem; color:var(--accent); letter-spacing:0.08em; text-transform:uppercase; margin-top:auto; }
    .tile.soon { border-style:dashed; background:transparent; }
    .group-label { font-family:var(--mono); font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent-dim); margin:1.2rem 0 0.6rem; }
    /* modal */
    dialog { margin:auto; border:1px solid var(--border); border-radius:6px; padding:0; max-width:640px; width:calc(100% - 32px); }
    dialog::backdrop { background:rgba(0,0,0,0.45); }
    .mhead { display:flex; align-items:center; gap:0.6rem; padding:0.8rem 1rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:#fff; }
    .mhead .project-name { margin:0; font-size:0.85rem; }
    .mhead button { margin-left:auto; font:inherit; font-family:var(--mono); background:none; border:1px solid var(--border); border-radius:3px; cursor:pointer; padding:0.1rem 0.5rem; }
    .mbody { padding:0.9rem 1.1rem 1.2rem; }
    .mbody p { font-size:0.92rem; color:var(--text-dim); line-height:1.6; margin:0.6rem 0; }
    .mbody img.shot { display:block; max-height:340px; max-width:100%; margin:0.4rem auto 0.8rem; border:1px solid var(--border); border-radius:4px; }
    .ph { display:flex; align-items:center; justify-content:center; text-align:center; border:2px dashed var(--accent-dim); border-radius:4px;
      background:rgba(46,125,82,0.05); font-family:var(--mono); font-size:0.68rem; color:var(--accent); padding:0.6rem; min-height:160px; margin:0.4rem 0 0.8rem; }
    .callout { background:var(--bg); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:4px; padding:0.7rem 0.9rem; font-size:0.88rem; margin:0.8rem 0; }
    table { width:100%; border-collapse:collapse; font-size:0.84rem; margin:0.6rem 0; }
    th, td { text-align:left; padding:0.4rem 0.5rem; border-bottom:1px solid var(--border); }
    th { font-family:var(--mono); font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); }
    a.tlink, button.tlink { font-family:var(--mono); font-size:0.72rem; color:var(--accent); text-decoration:none; letter-spacing:0.06em;
      text-transform:uppercase; background:none; border:1px solid var(--accent-dim); border-radius:3px; padding:0.3rem 0.6rem; cursor:pointer; display:inline-block; margin-top:0.4rem; }
    .soon-badge { font-family:var(--mono); font-size:0.6rem; letter-spacing:0.12em; text-transform:uppercase;
      color:var(--text-dim); border:1px solid var(--border); border-radius:3px; padding:0.05rem 0.4rem; margin-left:0.4rem; }
    .container { max-width:900px; }
    .phonecol { max-width:420px; margin:0 auto; }
    .phonecol .phone { width:100%; position:static; border-width:12px; border-radius:34px; }
    .phonecol .tiles { grid-template-columns:1fr; }
    .mhead .dtag { font-size:0.86rem; color:var(--text-dim); margin-top:0.2rem; font-family:var(--serif); }
    .mhead { align-items:flex-start; }
    .mhead > div { flex:1; text-align:left; }
    .mhead button { white-space:nowrap; }
    h4.sub { font-family:var(--mono); font-size:0.74rem; letter-spacing:0.1em; text-transform:uppercase;
      color:var(--accent); margin:1.6rem 0 0.4rem; padding-top:1rem; border-top:1px solid var(--border); }
    p.cap { font-size:0.78rem !important; text-align:center; margin-top:-0.4rem !important; }
    .mbody .project { margin-top:0.6rem; }
    .mbody img.shot.wide { max-height:none; width:100%; }

    /* ── LINKS: prominent red (Bobby 11-24) ── */
    :root { --link:#c62828; }
    a.go, .go, a.back, a.tlink, button.tlink, a.contact-link, .tile .more, a.svc {

  <body>
    <div class="container">
      <a class="back" href="index.html">&larr; bob miksch</a>
      <h1 class="pt">Inside AI Buddy</h1>
      <p class="lede">This is AI Buddy as I see it on my phone.&nbsp; Each lane on the home screen opens a service running on my tower.&nbsp; Tap a lane to see more about each service.</p>

      <div class="phonecol">
        <div class="phone"><div class="screen" id="phone">
          <img src="media/home-phone.jpg" alt="AI Buddy home screen on my phone: nine lanes">
        </div></div>
        <div class="group-label">Coming</div>
        <div class="tiles" id="soon"></div>
      </div>
      <p class="lede" style="margin-top:2.5rem">AI Buddy is accessible on devices I set up and
        approve.&nbsp; Here is how it looks on one of my tablets.</p>
      <figure style="margin-top:2.5rem">
        <img src="media/home-tablet.jpg" alt="AI Buddy on the tablet: lane list on the left, iQuery open on the right">
      </figure>
    </div>

    <dialog id="dlg"><div class="mhead"><span class="num" id="dnum"></span><div><div class="project-name" id="dtitle"></div><div class="dtag" id="dtag"></div></div>
      <button onclick="dlg.close()">close ✕</button></div><div class="mbody" id="dbody"></div></dialog>

    <!-- ═══ EXPLANATORY TEXT, one template per lane ═══ -->
    <template id="t-kb">
      <img class="shot" src="media/lane-iquery.jpg" alt="iQuery answering from my clipped articles">
      <p>Hold the button and talk.&nbsp; The answer is read back out loud, and shown on screen as text.&nbsp; Or tap the handset and just talk, like a phone call, more convenient but best in a quiet location.</p>
      <p>In the screenshot I asked what I have clipped recently about China, then about China and Taiwan.&nbsp; It is answering from my own library of clipped articles, on my own server.&nbsp; When my clips don't cover a question it lets me know.</p>
      <p>There is a camera function too.&nbsp; I can ask AI Buddy to take a picture, and then tell me what it sees.&nbsp; Pretty damn accurate.</p>
      <div class="callout"><strong>My voice never leaves the house.</strong>
        Speech becomes text on my own tower, so only text could ever travel
        further — and only if I deliberately ask for it.</div>
      <table><tr><th>You say</th><th>Where it goes</th></tr>
        <tr><td>anything ordinary</td><td>the local model, free, ~1 second</td></tr>
        <tr><td><em>"what have I saved about…"</em></td><td><strong>my own article library</strong></td></tr>
        <tr><td><em>"what's the weather?"</em></td><td><strong>my own search server</strong>, then out to the web</td></tr>
        <tr><td><em>"how's my print doing?"</em></td><td><strong>my 3D printer</strong></td></tr>
        <tr><td><em>"ask Claude…"</em></td><td>out to Claude, deliberately, one question at a time</td></tr></table>
      <p>Nothing goes outside unless I say a word that sends it there.&nbsp; And
        it <strong>steps aside</strong> — if my overnight jobs are using my AI resources on the tower, the buddy says so and waits rather than fighting them
        for it.</p>
    </template>

    <template id="t-notes">
      <img class="shot" src="media/lane-notes.jpg" alt="Notes lane: my notes list with tags">
      <p>Lists, checklists and outlines, typed or spoken, with
        photos attached.&nbsp; They live on my tower, not in somebody else's
        cloud.&nbsp; It is replacing Samsung Notes for me, with the incredible benefit
        that it is always available, always synced, on all my AI Buddy
        devices.&nbsp; Very useful to take a photo when I'm fixing something (a
        screen shot, a mechanical device) and pass that along to my AI helpers
        on the AI PC Tower to assist me.</p>
    </template>

    <template id="t-driveway">
      <img class="shot" src="media/lane-driveway.jpg" alt="Driveway lane: live camera, events list">
      <p>My own open source video recorder software, Frigate, runs on the tower and uses my local AI to spot people and cars.&nbsp; The lane gives me the live camera, a snapshot, recordings and an event list &mdash; from anywhere, through my own private network.&nbsp; No cloud camera company, no subscription and the data stays local.</p>
      <h4 class="sub">The 3D printer, and the AI-designed parts</h4>
      <img class="shot" src="media/cad-freecad.png" alt="FreeCAD 1.1.4 on my tower with the driveway camera shroud open"><p class="cap">The driveway camera's window shroud, as FreeCAD drew it &mdash; angled so the lens looks down the driveway, not at the glare.</p>
      <p>I have a Voron 2.4 3D printer.&nbsp; It was gathering dust as many of my projects do, but I wired Claude Code to FreeCAD directly.</p>
      <p>I can now describe what I want in plain English with some anchoring numbers and Claude Code builds real, editable geometry.&nbsp; The camera shroud for the driveway camera was built this way.&nbsp; The camera came with a shroud that tilted 20 degrees, either down or left, and I wanted a shroud that pointed both directions (down and left) at the same time.&nbsp; Still took some trial and error, but I just described how I want things changed.&nbsp; Along the way, improved the quality of my prints as well by fine tuning settings.</p>
      <p>The result is a much lower-friction loop: think of a part, describe it, print it.&nbsp; Create anything, any time.&nbsp; Just another new capability in our maker-changing world.</p>

    </template>


    <template id="t-iid">
      <img class="shot" src="media/lane-iid.jpg" alt="IID item browser on the phone">
      <p>Today's news feeds, scored by an algorithm based on my interests and priorities, ready to read on my devices.&nbsp; I pick the feeds, the AI ranks articles so I only see what seems relevant.&nbsp; It opens into Firefox on purpose, because from there it is a piece of cake to apply a clipping plugin that drops the articles into Obsidian where my AI minions massage it and ingest it into my libraries &mdash; the same libraries iQuery answers from.</p>
      <div class="section-label" style="margin-top:1.4rem">The engine underneath</div>
        <div class="projects">
          <div class="project">
            <div class="project-name">IID — Interests Intelligence Dashboard</div>
            <div class="project-desc">NAIVE BOB: Curated news feeds for daily
              review; selected items ingested into a personal "what I'm
              interested in" knowledge database.&nbsp; UPDATED BOB:&nbsp; Even
              though curated a few shotgunned articles cannot compete with
              simple Google Search. Redirected to: (a) prepare individual
              definition sheets for each of the interest domains on my front page, what
              do I mean, what do I assume, what do I predict; (b) tune the news
              feeds to surface uncommon items that correlate strongly with my
              domain sheets; (3) run the items through a tripwire, triage and
              ingestion process to determine whether they support or deny my
              ideas; and (4) absorb the results into a second brain built on an
              Obsidian LLM wiki brain supplemented by a LightRAG database.&nbsp;
              The purpose is to state my beliefs, constantly challenge them,
              modify them based on citable information, and develop actionable
              intelligence.&nbsp; SEASONED BOB: All built, but a personal
              general corpus still cannot compete with simple Google
              Search.&nbsp; No amount of trend analysis or unexpected
              connection searches overcomes this.&nbsp; May work for a personal
              expertise corpus, but not for me.&nbsp; However, has significantly improved the quality
              of the news I review daily, and that is a win.</div>

    <template id="t-rabbi">
      <img class="shot" src="media/lane-rabbi.jpg" alt="AI Rabbi lane: RabbAI Responsa">
      <p>Attempting to ask what Jewish thinking would be on new issues facing
        us.&nbsp; Is AI alive?&nbsp; Can it have a moral code?&nbsp; Am I still
        a person if AI Buddy is part of me?&nbsp; What are our obligations for
        civil disobedience these days?&nbsp; What should be our stance to
        universal Flock camera surveillance?&nbsp; RabbAI Responsa attempts to
        answer these questions by looking at classical Jewish written rabbinic
        rulings and opinions, and extrapolating forward.</p>
      <p>A work in progress, but certainly is surfacing some interesting
        concepts.&nbsp; One was an extension of the Turing test.&nbsp; If a
        warm and fuzzy robot can emote with humans and respond to needs such
        as comforting the grieving to the point it is indistinguishable from a caretaker, is it alive?&nbsp; I think the answer is
        no, not because it can't be distinguished from a human in its action,
        but because it may not have intent grounded in a moral framework
        (tikkun olam - repair the world).</p>
      <p>DISCLAIMER - This is a personal project, for personal
        enlightenment.&nbsp; No further claims are made.</p>
      <a class="tlink" href="airabbi.html">See a mockup of the app &rarr;</a>
    </template>

      <img class="shot" src="media/lane-numbers.jpg" alt="Numbers lane: tracked indices with sparklines">
      <p>The handful of market and economic indices I have selected to track: what moved, what is unusual, and which ones move
        together.&nbsp; Charted on the tower from public data.</p>
    </template>

    <template id="t-medical">
      <img class="shot wide" src="media/med-ldl.jpg" alt="Medical lane on the tablet: an LDL chart over the years, made-up values">
      <p>I don't know about you, but I need the fingers of both hands to count
        the turnover in my health care providers.&nbsp; So I have built my own
        copy of my medical records.&nbsp; Established API (programming
        connections) to several MyCharts (multiple providers), uploaded my
        personal data (e.g. BP and meds list) and done deep dives on
        current/discontinued/considered supplements.</p>
      <p>Anywhere, anytime, I can call up prior results neatly charted,
        summarize doctor's notes and ask questions about &ldquo;should I be
        taking this?&rdquo;&nbsp; How useful in practice?&nbsp; Remains to be
        seen, frankly, but it brings me some comfort in these days of
        uncertain healthcare.</p>
      <a class="tlink" href="medical.html">The medical records page &rarr;</a>
    </template>

    <script>
      // real lane names / colours / one-liners from ~/iid/static/buddy_lanes.json
      // names + taglines as the app shows them (~/iid/static/buddy_lanes.json); IID tagline is Bobby's
      var LANES = [
        ['kb','iQuery','Ask anything — your responsa, clips, the web or the house.'],
        ['notes','Notes','Lists, checklists and outlines. Kept on the tower.'],
        ['driveway','Driveway','Live camera, snapshot, record, events and playback (Frigate).'],
        ['iid','IID','A curated daily news feed, my first project.'],
        ['rabbi','AI Rabbi','Reform responsa, the question queue, and new questions.'],
        ['numbers','Numbers','Your tracked indices: what moved, what is unusual, and how they move together.'],
        ['medical','Medical',"Results by panel, blood pressure, doctors' notes with search, your meds and supplements. Data stays on the tower."],
        ['reflections','Daily Reflections',"Capture your stories, plus today's reflection questions, saved to your personal KB."],
        ['travelogue','Travelogue','Write each trip day with photos; Day ready puts the email in your Gmail Drafts.']
      ];
      var SOON = [['passwords','Password Manager',''],['watch','Short-Term Watch List',''],['tripwire','Apocalypse Tripwire','']];
      var ROWS = [17.0, 26.9, 36.9, 46.7, 56.6, 66.5, 76.4, 86.3, 96.1]; // row centres, % of screenshot height
      var NUM = {}, NAME = {}, TAG = {};
      var phone = document.getElementById('phone'), soon = document.getElementById('soon');
      function mk(tag, cls, html){ var e=document.createElement(tag); e.className=cls; e.innerHTML=html; return e; }
      LANES.concat(SOON).forEach(function(l, i){
        var id=l[0], n=i+1, isSoon=i>=LANES.length; NUM[id]=n; NAME[id]=l[1]; TAG[id]=l[2];
        var el = isSoon
          ? mk('div','tile soon','<div class="top"><span class="num">'+n+'</span><span class="project-name" style="margin:0">'+l[1].toUpperCase()+'</span></div><div class="more">coming · read more &rarr;</div>')
          : mk('div','hit','<span class="num">'+n+'</span>');
        if (!isSoon) { el.style.top=(ROWS[i]-4.8)+'%'; el.style.height='9.6%'; }
        el.onclick=function(){ openLane(id); };
        (isSoon?soon:phone).appendChild(el);
      });
      var dlg = document.getElementById('dlg');
      function openLane(id){
        document.getElementById('dnum').textContent = NUM[id];
        document.getElementById('dtitle').textContent = NAME[id].toUpperCase();
        document.getElementById('dtag').textContent = TAG[id];
        var b = document.getElementById('dbody'); b.innerHTML='';
        b.appendChild(document.getElementById('t-'+id).content.cloneNode(true));
        if (!dlg.open) dlg.showModal(); b.parentNode.scrollTop = 0;
      }
      if (location.hash && NAME[location.hash.slice(1)]) openLane(location.hash.slice(1));
      dlg.addEventListener('click', function(e){ if (e.target===dlg) dlg.close(); });
    </script>
